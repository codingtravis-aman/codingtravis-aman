<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="Live GitHub Snapshot">
<defs>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="ll" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="lr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
<filter id="g" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="d" x="-400%" y="-400%" width="900%" height="900%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect x="40" y="31" width="182" height="2" rx="1" fill="url(#ll)"/>
<rect x="778" y="31" width="182" height="2" rx="1" fill="url(#lr)"/>
<circle cx="40" cy="32" r="5" fill="#22D3EE" filter="url(#d)"><animate attributeName="cx" values="40;222;40" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="960" cy="32" r="5" fill="#A78BFA" filter="url(#d)"><animate attributeName="cx" values="960;778;960" dur="4s" repeatCount="indefinite"/></circle>
<g stroke="#22D3EE" stroke-width="2" fill="none" stroke-linecap="round">
<path d="M236 14 h-10 v36 h10"><animate attributeName="stroke-opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></path>
<path d="M764 14 h10 v36 h-10"><animate attributeName="stroke-opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></path>
</g>
<text x="500" y="43" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="5" fill="url(#ac)" filter="url(#g)">LIVE GITHUB SNAPSHOT</text>
</svg>