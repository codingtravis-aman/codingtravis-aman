<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Aman Jha - Full-Stack Developer and Data Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F2A"/>
      <stop offset=".55" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b">
        <animate attributeName="stdDeviation" values="3;9;3" dur="4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22D3EE" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- rotating rings -->
    <g fill="none" stroke-width="1.5">
      <circle cx="110" cy="110" r="62" stroke="#22D3EE" stroke-opacity=".5" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" values="0 110 110;360 110 110" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="110" cy="110" r="38" stroke="#A78BFA" stroke-opacity=".6" stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate" values="360 110 110;0 110 110" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="890" cy="110" r="62" stroke="#A78BFA" stroke-opacity=".5" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" values="360 890 110;0 890 110" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle cx="890" cy="110" r="38" stroke="#22D3EE" stroke-opacity=".6" stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate" values="0 890 110;360 890 110" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- floating particles -->
    <g fill="#22D3EE">
      <circle cx="220" cy="70" r="2"><animate attributeName="cy" values="70;48;70" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="40" r="1.6"><animate attributeName="cy" values="40;62;40" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.2;.9" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="62" r="2.2"><animate attributeName="cy" values="62;38;62" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="44" r="1.8"><animate attributeName="cy" values="44;66;44" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;.2;.8" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="66" r="2"><animate attributeName="cy" values="66;42;66" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.9;.2" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="46" r="1.6"><animate attributeName="cy" values="46;70;46" dur="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;.3;.9" dur="4.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- name -->
    <text x="500" y="125" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="4" fill="url(#ac)" filter="url(#glow)">AMAN JHA</text>
    <text x="500" y="168" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" letter-spacing="6" fill="#A5F3FC">FULL-STACK DEVELOPER · DATA ANALYST</text>

    <!-- rotating roles -->
    <g font-family="'Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="20" fill="#22D3EE" text-anchor="middle">
      <text x="500" y="214" opacity="0">&gt; Full-Stack Engineer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="500" y="214" opacity="0">&gt; Data Analytics &amp; Automations
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="500" y="214" opacity="0">&gt; Building Scalable Apps
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="500" y="214" opacity="0">&gt; Cyber Security Enthusiast
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/></text>
    </g>

    <!-- waves -->
    <path fill="#6D28D9" fill-opacity=".38" d="M0 262 Q125 236 250 262 T500 262 T750 262 T1000 262 T1250 262 T1500 262 T1750 262 T2000 262 V300 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#06B6D4" fill-opacity=".28" d="M-400 272 Q-300 250 -200 272 T0 272 T200 272 T400 272 T600 272 T800 272 T1000 272 T1200 272 T1400 272 V300 H-400 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;400 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <rect x="0" y="288" width="1000" height="12" fill="#0B0F2A" fill-opacity=".6"/>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="21" fill="none" stroke="#22D3EE" stroke-opacity=".35"/>
</svg>
