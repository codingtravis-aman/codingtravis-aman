<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" role="presentation">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".25" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset=".75" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="0" y="9" width="1000" height="2" rx="1" fill="url(#l)"/>
  <rect x="494" y="4" width="12" height="12" fill="#A78BFA" transform="rotate(45 500 10)"/>
  <circle cx="100" cy="10" r="5" fill="#22D3EE" filter="url(#g)">
    <animate attributeName="cx" values="100;900;100" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="10" r="2.5" fill="#E0F2FE">
